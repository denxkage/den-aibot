services:

- type: worker
  name: deden-ai-telegram
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: python bot.py
  envVars:
  - key: TELEGRAM_BOT_TOKEN
    sync: false
  - key: OPENAI_API_KEY
    sync: false
  - key: OPENAI_MODEL
    value: gpt-4.1-mini
  - key: DATABASE_URL
    sync: false
